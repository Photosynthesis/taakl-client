<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>theme test drive</title>
<style>body{margin:0;overflow:hidden;font-family:monospace}#status{box-sizing:border-box;height:28px;padding:6px;background:#222;color:#0f0;font-size:12px;white-space:nowrap;overflow:hidden}iframe{border:0;width:100vw;height:calc(100vh - 28px)}</style>
</head>
<body>
<div id="status">loading…</div>
<iframe id="f" src="../index.html"></iframe>
<script>
var params = new URLSearchParams(location.search);
var mode = params.get('mode') || 'today';
var f = document.getElementById('f');
var statusEl = document.getElementById('status');
// ?w=420 forces the iframe (app viewport) width — headless Chrome has a
// 500px minimum window width, so narrow breakpoints need this.
if (params.get('w')) f.style.width = params.get('w') + 'px';
var errors = [];
f.onload = function(){
  var w = f.contentWindow;
  w.onerror = function(msg){ errors.push(String(msg)); };
  setTimeout(function(){
    try {
      // Fresh profiles get the login modal; dismiss it so views are visible
      // (mode=login keeps it up to inspect the modal itself)
      var skip = w.document.querySelector('#auth-modal a[onclick*="skipAuth"]');
      if (skip && mode !== 'login') skip.click();
      // Optional theme under test: ?theme=studio
      var theme = params.get('theme');
      if (theme) w.applyTheme(theme);
      if (mode === 'plan' || mode === 'review') {
        // Seed a small tree via real code paths (folders + tasks)
        if ((w.ttData.rootOrder || []).length === 0) {
          var f1 = w.createNode(null, {name: 'Practice', type: 'folder'});
          w.createNode(f1.id, {name: 'Meditate', type: 'task', estimate: 1200});
          var wr = w.createNode(f1.id, {name: 'Writing', type: 'task', estimate: 1800, starred: '1'});
          wr.sessions[w.newId()] = {start_time: '2026-09-24 08:00:00', end_time: '2026-09-24 09:02:00'};
          var f2 = w.createNode(null, {name: 'Home', type: 'folder'});
          w.createNode(f2.id, {name: 'Manual house search', type: 'task', urgent: '1'});
          var f3 = w.createNode(f2.id, {name: 'Berlin research', type: 'folder'});
          w.createNode(f3.id, {name: 'Look at itinerary options', type: 'task', estimate: 1200});
          w.ttSave();
        }
      }
      if (mode === 'today' || mode === 'collapse') {
        w.setView('todayView');
        // seed via real code paths
        w.gebi('today-new-task-input').value = 'Morning writing #daily #morning (30m)';
        w.treeView.saveNewTaskFromToday();
        w.gebi('today-new-task-input').value = 'Wind down #daily #evening';
        w.treeView.saveNewTaskFromToday();
        // star one task
        var tasks = w.getAllTaskNodes();
        if (tasks.length) { w.todayView.toggleNodeStar(tasks[0].id); }
        if (mode === 'collapse') { w.todayView.toggleSection('morning'); }
        // ?session=bar starts a session (collapsed bar); ?session=full expands it
        if (params.get('session') && tasks.length) {
          w.treeView.startSession(tasks[0].id);
          if (params.get('session') === 'full') { w.expandSessionTimer(); }
        }
      } else if (mode === 'settings') {
        w.setView('settingsView');
      } else if (mode === 'plan') {
        w.setView('taskList');
        w.treeView.update();
      } else if (mode === 'review') {
        w.setView('analyze');
      }
      setTimeout(function(){
        var nodeColor = '';
        var row = w.document.querySelector('.tree-row') || w.document.querySelector('.today-task-item');
        if (row) nodeColor = row.style.getPropertyValue('--node-color');
        var themeSel = w.document.getElementById('settings-themeinput');
        statusEl.textContent = 'mode=' + mode +
          ' | errors=' + (errors.length ? errors.join(';') : 'none') +
          ' | node-color=' + (nodeColor || 'MISSING') +
          ' | theme-select=' + (themeSel ? Array.prototype.map.call(themeSel.options, function(o){ return o.value; }).join(',') : 'n/a') +
          ' | date=' + (w.gebi('today-date') ? w.gebi('today-date').textContent : '?') +
          ' | bodyclass=' + w.document.body.className +
          ' | scrollW=' + w.document.documentElement.scrollWidth + '/' + w.innerWidth;
      }, 400);
    } catch(e) {
      statusEl.textContent = 'DRIVER ERROR: ' + e.message;
    }
  }, 600);
};
</script>
</body>
</html>
